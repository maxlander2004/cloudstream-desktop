name: Build desktop installers

# jpackage can only build an MSI or EXE on Windows, so the installer must be produced
# there rather than cross-compiled.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the built installers to this tag's release (created if missing)"
        required: false
        default: ""
  push:
    branches:
      - "**"
    # No `paths` filter: a tag push must always run so its installers reach the release.
    tags:
      - "v*"
  # Publishing a GitHub Release builds the installers and attaches them to that release so
  # they are directly downloadable from its page. (A `paths` filter never fires for tag
  # pushes, which is why releases use their own event instead of the push trigger.)
  release:
    types: [published]

# The release job attaches files with GITHUB_TOKEN; default permissions are read-only.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cloudstream-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # jpackage shells out to WiX (candle/light) to make an MSI or EXE. It ships with most
      # Windows runner images; install it only if this image ever drops it.
      - name: Ensure WiX is available
        shell: bash
        run: |
          if command -v candle >/dev/null 2>&1 && command -v light >/dev/null 2>&1; then
            echo "WiX already on PATH"
            exit 0
          fi
          choco install wixtoolset -y --no-progress
          wix_bin="$(ls -d "/c/Program Files (x86)/WiX Toolset v3."*/bin 2>/dev/null | head -1)"
          if [ -z "$wix_bin" ]; then
            wix_bin="$(ls -d "/c/Program Files/WiX Toolset v3."*/bin 2>/dev/null | head -1)"
          fi
          if [ -z "$wix_bin" ]; then
            echo "::error::WiX Toolset 3.x is required by jpackage but was not found"
            exit 1
          fi
          echo "$wix_bin" >> "$GITHUB_PATH"
          echo "Installed WiX at $wix_bin"

      - name: Test
        run: ./gradlew test --console=plain
        shell: bash

      - name: Load real CloudStream extensions
        run: ./gradlew verifyLegacy --console=plain
        shell: bash

      - name: Build MSI and EXE
        run: ./gradlew :packageMsi :packageExe --console=plain
        shell: bash

      - name: Build example extension
        run: ./gradlew :extensions:archive-org:jar --console=plain
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: cloudstream-windows
          if-no-files-found: error
          path: |
            cloudstream-desktop/build/compose/binaries/main/msi/*.msi
            cloudstream-desktop/build/compose/binaries/main/exe/*.exe
            cloudstream-desktop/extensions/archive-org/build/libs/*.jar

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudstream-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build DEB
        run: ./gradlew :packageDeb --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: cloudstream-linux
          if-no-files-found: error
          path: cloudstream-desktop/build/compose/binaries/main/deb/*.deb

  # Attaches the Windows installers to a GitHub Release. A release event reuses the
  # triggering release; a `v*` tag push does the same for that tag's release (created if
  # missing); a dispatch run with `release_tag` sets one up itself (the
  # workflow token has the permissions the user's own token may not).
  release:
    if: github.event_name == 'release' || github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudstream-windows
          path: installers

      - name: Publish installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job: tell gh the repository explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "CloudStream Desktop $TAG" --generate-notes --verify-tag
          fi
          files="$(find installers -type f \( -name '*.msi' -o -name '*.exe' \))"
          if [ -z "$files" ]; then
            echo "::error::No installers found in the artifact"
            exit 1
          fi
          # Word splitting is intended: gh takes each file as its own argument.
          # shellcheck disable=SC2086
          gh release upload "$TAG" $files --clobber

      # The tag can be re-pushed (e.g. after a version fix), leaving assets named after an
      # older build on the release; remove anything this build did not just upload.
      - name: Remove stale assets from earlier builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_type == 'tag' && github.ref.name || inputs.release_tag }}
        run: |
          keep="$(find installers -type f \( -name '*.msi' -o -name '*.exe' \) -printf '%f\n')"
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | while read -r name; do
            if ! printf '%s\n' "$keep" | grep -qxF "$name"; then
              gh release delete-asset "$TAG" "$name" -y && echo "Removed stale asset $name"
            fi
          done
