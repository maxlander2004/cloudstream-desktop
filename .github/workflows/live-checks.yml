name: Live checks

# `test` is hermetic by design: no test in it reaches the network, so a pull request never fails
# because a third-party provider was slow or a repository index was being rebuilt. The checks
# that genuinely need the internet live here instead, on a schedule. A failure here means
# something real changed upstream — an extractor, the extension repository, a torrent bridge —
# and is worth looking at, but it is not a reason to block a pull request.
on:
  schedule:
    # Nightly, away from the hour boundary and from the 06:17 upstream sync.
    - cron: "43 4 * * *"
  workflow_dispatch:
  # Changing the checks (or the archive smoke check itself) runs them immediately, so a fix to
  # this file is proved by an execution rather than by waiting for the next night.
  push:
    paths:
      - ".github/workflows/live-checks.yml"
      - "cloudstream-desktop/src/test/kotlin/app/cloudstream/desktop/AbiSmoke.kt"
      - "cloudstream-desktop/src/test/kotlin/app/cloudstream/desktop/AbiContractTest.kt"
      - "scripts/check-dependency-drift.pl"

permissions:
  contents: read

concurrency:
  group: live-checks
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudstream-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Cheap and offline, but this is the workflow most likely to notice a new upstream release
      # before the sync has had time to run.
      - name: Dependency drift against upstream's catalog
        run: perl ../scripts/check-dependency-drift.pl

      # The tests tagged `network`: live providers, third-party APIs, the torrent bridge. Nothing
      # is tagged yet beyond the opt-in torrent smoke, which skips itself without TORRENT_SMOKE.
      # New tests that reach out belong behind this tag rather than in `test`.
      - name: Network-tagged tests
        run: ./gradlew --console=plain networkTest

      # The ABI's real-world half: a published archive's translated bytecode linking against
      # :cs-compat, with no browsing or searching.
      - name: ABI smoke test against a published extension
        run: ./gradlew --console=plain abiSmoke

  # A check nobody watches is a check that is allowed to die. A green build stays silent, so a
  # failure on the schedule (or on a manual dispatch, so the path can be exercised on demand)
  # would otherwise be a red run in a list that nobody opens; this puts it
  # where somebody will see it. One issue, updated on each failure rather than a new one per
  # night, and closed automatically once a run is green again. Push-triggered runs are silent:
  # they prove this file, they should not page anyone.
  report:
    needs: live
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the live-checks issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULT: ${{ needs.live.result }}
          SHA: ${{ github.sha }}
        run: |
          title="Scheduled live checks are failing"
          existing="$(gh issue list --state open --search "in:title \"$title\"" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"

          if [ "$JOB_RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Green again: $RUN_URL"
              echo "Closed issue #$existing"
            else
              echo "Green, and no open issue to close"
            fi
            exit 0
          fi

          body="$(printf 'The scheduled live checks failed: %s\n\n- commit: `%s`\n- workflow: %s\n\nThe steps are the dependency-drift check against upstream, the network-tagged tests and the\nreal-archive ABI smoke test. A failure here means something changed upstream, not that a pull\nrequest broke something; the run log says which step and why.\n' \
            "$JOB_RESULT" "$SHA" "$RUN_URL")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create --title "$title" --body "$body"
            echo "Opened a new issue"
          fi
